spec_version: "0.1.0"
name: "resume-job-matching-agent"
display_name: "ResumeJobMatchingAgent"
version: "1.0.0"
description: "Framework-independent portable agent for resume profiling, job posting analysis, skill matching, qualification gap analysis, and application-readiness reporting."
author: "HiDevs Community"
license: "MIT"

capabilities:
  - name: "resume_profiling"
    description: "Extract structured skills, education, experience, and certifications from resume."
    tool: "resume_profiler_tool"
  - name: "job_description_profiling"
    description: "Extract required skills, preferred skills, and experience expectations from job description."
    tool: "job_description_profiler_tool"
  - name: "skill_matching"
    description: "Compare resume skills against job requirements with match classification."
    tool: "skill_matching_tool"
  - name: "qualification_gap_analysis"
    description: "Identify missing requirements and experience gaps without inventing data."
    tool: "qualification_gap_tool"
  - name: "compatibility_analysis"
    description: "Compute deterministic compatibility scores with full mathematical breakdown."
    tool: "compatibility_analyzer_tool"
  - name: "recommendation_generation"
    description: "Generate practical resume enhancement and job-fit recommendations."
    tool: "recommendation_tool"
  - name: "matching_report"
    description: "Produce a structured final report summarizing profiles, matches, gaps, and recommendations."
    tool: "matching_report_tool"

tools:
  - "resume_profiler_tool"
  - "job_description_profiler_tool"
  - "skill_matching_tool"
  - "qualification_gap_tool"
  - "compatibility_analyzer_tool"
  - "recommendation_tool"
  - "matching_report_tool"

entrypoint:
  adapter: "adapters.portable_adapter.PortableAdapter"
  core: "core.agent_core.AgentCore"

portability:
  framework_independent: true
  offline_capable: true
